name: CQ / Ruff Checks

on:
  push:
    tags-ignore: ['v*']
  pull_request:
    branches: [main, v3]

permissions:
  contents: read

concurrency:
  group: cq-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install frozen project
        working-directory: apps/api
        run: uv sync --frozen
      - name: Check lint without modifying the branch
        working-directory: apps/api
        run: uv run --frozen ruff check app tests

  format:
    name: Ruff Format
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install frozen project
        working-directory: apps/api
        run: uv sync --frozen
      - name: Check format without modifying the branch
        working-directory: apps/api
        run: uv run --frozen ruff format --check app tests
