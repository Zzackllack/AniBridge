name: CQ / Ruff Checks

on:
  push:
    tags-ignore: ['v*']
  pull_request:
    branches: [main, v3]

permissions:
  contents: read

concurrency:
  group: cq-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
      - name: Install frozen project
        working-directory: apps/api
        run: uv sync --frozen
      - name: Check lint without modifying the branch
        working-directory: apps/api
        run: uv run --frozen ruff check app tests

  format:
    name: Ruff Format
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
      - name: Install frozen project
        working-directory: apps/api
        run: uv sync --frozen
      - name: Check format without modifying the branch
        working-directory: apps/api
        run: uv run --frozen ruff format --check app tests
