name: anibridge-query-pilot
x-build: &worker-build
  context: ../../..
  dockerfile: apps/catalog-worker/Dockerfile
  args:
    PILOT_COMMIT: ${PILOT_COMMIT:?Set PILOT_COMMIT to git rev-parse HEAD}
x-logs: &bounded-logs
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
services:
  init:
    image: anibridge-query-worker:${PILOT_COMMIT}
    build: *worker-build
    user: root
    entrypoint: [python, -m, catalog_worker.pilot_seed]
    command: [/config]
    volumes: [config:/config, worker-state:/state, read-catalog:/read]
    network_mode: none
    mem_limit: 512m
    cpus: 2
    logging: *bounded-logs
  catalog:
    image: anibridge-query-worker:${PILOT_COMMIT}
    build: *worker-build
    command: [--config, /config/worker.json, --serve, --token-file, /config/metadata-token]
    depends_on: {init: {condition: service_completed_successfully}}
    volumes: [config:/config:ro, worker-state:/state, read-catalog:/read]
    ports: ['127.0.0.1:18080:8080']
    networks: [private]
    mem_limit: 512m
    cpus: 2
    logging: *bounded-logs
  api:
    image: anibridge-query-api:${PILOT_COMMIT}
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
      args: {PILOT_COMMIT: '${PILOT_COMMIT}'}
    depends_on: [catalog]
    environment:
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      CATALOG_SITES: aniworld.to
      CATALOG_CONFIG_FILE: /config/client.json
      ANIWORLD_BASE_URL: https://fixture.invalid
      ANIBRIDGE_TEST_MODE: '1'
      ANIBRIDGE_RELOAD: 'false'
      DB_MIGRATE_ON_STARTUP: 'true'
      LOG_LEVEL: WARNING
      STRM_FILES_MODE: 'no'
    volumes: [config:/config:ro, local-state:/data, downloads:/downloads, './:/pilot:ro']
    ports: ['127.0.0.1:18000:8000']
    networks: [private]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    logging: *bounded-logs
networks:
  private: {internal: true}
volumes:
  config:
  worker-state:
  read-catalog:
  local-state:
  downloads:
