# Optional, disposable real-client metadata fixture. No provider media is used.
services:
  api:
    volumes: [sonarr-state:/sonarr-config:ro, prowlarr-state:/prowlarr-config:ro]
  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
    environment: {PUID: '1000', PGID: '1000', TZ: Etc/UTC}
    volumes: [sonarr-state:/config, downloads:/downloads]
    networks: [private]
    mem_limit: 512m
    cpus: 1
    logging: {driver: json-file, options: {max-size: 10m, max-file: '2'}}
  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:f2b26429893d4c4cb71941b7ee50b1bdecd9d5f9f9e02d5410615e9f4f7c8d95
    environment: {PUID: '1000', PGID: '1000', TZ: Etc/UTC}
    volumes: [prowlarr-state:/config]
    networks: [private]
    mem_limit: 512m
    cpus: 1
    logging: {driver: json-file, options: {max-size: 10m, max-file: '2'}}
volumes:
  sonarr-state:
  prowlarr-state:
